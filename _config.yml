title: html_bin
description: A running archive of saved media, with notes.
repository: misteramazingyt/html_bin

# Sign-in. GitHub Pages is static, so the OAuth code->token exchange (which
# needs the client secret) happens in the n8n workflow "GitHub OAuth (html_bin)".
# Register this exact callback on the OAuth App: the oauth_broker value below.
github_client_id: "Ov23liYGEFHFZButqJUx"
oauth_broker: https://n8n.shae.dpdns.org/webhook/gh-oauth

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

# Every note page gets the custom layout; index.html opts out with `layout: null`.
defaults:
  - scope:
      path: ""
    values:
      layout: default

include:
  - CONTRIBUTING.md
  - README.md
  - LICENSE.md
  - COPYING.md
  - CODE_OF_CONDUCT.md
  - ISSUE_TEMPLATE.md
  - PULL_REQUEST_TEMPLATE.md

exclude:
  - html1.html
